name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l cmd internal mmaid.go mmaid_test.go golden_test.go tools)"
      - name: vet and tests
        run: make check
      - name: goldens and structural lint
        run: make golden
      - name: known-bad is empty
        run: test -z "$(grep -v '^#' testdata/fixtures/known-bad.txt | grep -v '^$')"
      - name: cross-compile
        run: make dist
