name: Rendering or CLI bug
description: Something renders wrong, crashes, or a flag misbehaves
labels: [bug]
body:
  - type: textarea
    id: source
    attributes:
      label: Mermaid source
      description: The smallest diagram that shows the problem.
      render: text
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command and output
      description: The exact command, and either the terminal output or the frame from `mmaid --cells - file.mmd`. A `make snap` PNG is welcome.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
  - type: input
    id: version
    attributes:
      label: mmaid version and terminal
      description: "`mmaid --version`, and `mmaid config show` if the terminal matters"
    validations:
      required: true
